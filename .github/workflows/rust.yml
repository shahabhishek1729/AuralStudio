name: Rust Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  rust-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Run cargo test
        run: cd server && sudo apt-get install libgtk-3-dev && sudo apt install libglib2.0-dev && sudo apt install libsoup2.4-dev && sudo apt install libjavascriptcoregtk-4.0-dev && PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1 cargo test --all
